<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sentiment Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 7vh 20px 32px; font: 16px/1.55 system-ui, sans-serif; background: #f0f5f4; color: #142d2c; }
  main { max-width: 690px; margin: auto; }
  .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: #466763; }
  h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; margin: .45rem 0 .8rem; letter-spacing: -.045em; }
  .intro { color: #46605e; margin: 0 0 1.6rem; }
  .card { background: white; border: 1px solid #cbd9d7; border-radius: 18px; padding: clamp(16px, 5vw, 30px); }
  label { display: block; font-weight: 700; margin-bottom: .5rem; }
  textarea { font: inherit; width: 100%; min-height: 145px; padding: 12px; border: 1px solid #7e9996; border-radius: 10px; resize: vertical; color: inherit; }
  button { font: inherit; cursor: pointer; }
  .primary { margin-top: 14px; padding: .65rem 1rem; background: #16564e; color: #fff; border: 0; border-radius: 8px; font-weight: 700; }
  :focus-visible { outline: 3px solid #457cc0; outline-offset: 3px; }
  .examples { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .example { border: 1px solid #bdcfcc; background: #f4f8f7; color: #284e49; border-radius: 999px; padding: .28rem .7rem; font-size: .88rem; }
  .result { margin: 1.2rem 0 0; padding: .8rem 1rem; border-radius: 8px; font-weight: 700; background: #edf1f7; }
  .result[data-label="Positive"] { background: #e4f4e9; color: #16472a; }
  .result[data-label="Negative"] { background: #f9e9e6; color: #782b22; }
  .result[data-label="Neutral"] { background: #fff2d8; color: #63440d; }
  footer { font-size: .9rem; color: #46605e; margin: 1rem 0 0; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Business IT Project</div>
  <h1>Review Sentiment Demo</h1>
  <p class="intro">Enter an English product review to get a sentiment prediction.</p>
  <div class="card">
    <form id="review-form">
      <label for="review">Product review</label>
      <textarea id="review" placeholder="I did not like the smell." required></textarea>
      <button class="primary" type="submit">Predict sentiment</button>
    </form>
    <div class="examples" aria-label="Try an example">
      <button class="example" type="button" data-review="The product works well.">Try praise</button>
      <button class="example" type="button" data-review="I did not like the smell.">Try a complaint</button>
      <button class="example" type="button" data-review="It works, but the scent is too strong.">Try mixed feedback</button>
    </div>
    <p class="result" id="result" role="status" hidden></p>
  </div>
  <footer>Uses the project's trained TF-IDF and Logistic Regression model. Predictions can be wrong, especially for short or mixed reviews. Everything runs locally in this browser.</footer>
</main>

    .replace(/(?<![\p{L}\p{N}_])won't(?![\p{L}\p{N}_])/gu, "will not")
    .replace(/(?<![\p{L}\p{N}_])can't(?![\p{L}\p{N}_])/gu, "can not")
    .replace(/n't(?![\p{L}\p{N}_])/gu, " not")
    .match(/[a-z]+/g) ?? []).filter(word => !stopWords.has(word) && word.length >= 2);
}

function predict(text) {
  const words = preprocess(text);
  const counts = new Map();
  function count(term) {
    const index = vocabulary.get(term);
    if (index !== undefined) counts.set(index, (counts.get(index) ?? 0) + 1);
  }
  words.forEach((word, index) => {
    count(word);
    if (index + 1 < words.length) count(word + " " + words[index + 1]);
  });
  let squaredNorm = 0;
  const features = [...counts].sort((left, right) => left[0] - right[0])
    .map(([index, frequency]) => {
      const value = frequency * model.idf[index];
      squaredNorm += value * value;
      return [index, value];
    });
  const norm = Math.sqrt(squaredNorm);
  const scores = model.weights.map((weights, index) => {
    let score = 0;
    for (const [feature, value] of features) score += (value / norm) * weights[feature];
    return score + model.intercepts[index];
  });
  const best = scores.reduce((best, score, index) => score > scores[best] ? index : best, 0);
  return model.labels[best];
}

const input = document.querySelector("#review");
const result = document.querySelector("#result");
function showPrediction() {
  const text = input.value.trim();
  result.hidden = false;
  result.dataset.label = text ? predict(text) : "";
  result.textContent = text ? "Predicted sentiment: " + result.dataset.label : "Enter a review first.";
}
document.querySelector("#review-form").addEventListener("submit", event => {
  event.preventDefault();
  showPrediction();
});
input.addEventListener("input", () => { result.hidden = true; });
for (const button of document.querySelectorAll(".example")) {
  button.addEventListener("click", () => {
    input.value = button.dataset.review;
    showPrediction();
  });
}
</script>
